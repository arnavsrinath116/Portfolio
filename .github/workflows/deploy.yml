# Builds the Astro site and publishes it to GitHub Pages on every push to main.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push doesn't cancel a deploy already in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Build with Astro and upload the site
        uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
